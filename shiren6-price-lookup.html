  <style>
    :root {
      --bg: #14171c;
      --surface: #1c2128;
      --text: #e6eaf0;
      --muted: #9aa3af;
      --border: #2e3640;
      --accent: #6ea8fe;
      --accent-hover: #8bbcff;
      --warn-bg: #2a2215;
      --warn-border: #8a6a2b;
      --info-bg: #182230;
      --info-border: #35507a;
      --neutral-bg: #222830;
      --row-alt: #181c22;
      --input-bg: #12161b;
      --th-bg: #232933;
      --err: #e8a090;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", Meiryo, sans-serif;
      background: linear-gradient(180deg, #1a1f27 0%, var(--bg) 200px);
      color: var(--text);
      line-height: 1.5;
      color-scheme: dark;
    }
    .wrap {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px 20px 48px;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    h2 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 650;
    }
    .lead {
      margin: 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 20px 0;
    }
    .stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      min-width: 88px;
    }
    .stat .v {
      font-size: 1.35rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .stat .l {
      font-size: 0.75rem;
      color: var(--muted);
    }
    .callout {
      border-radius: 10px;
      padding: 12px 14px;
      border: 1px solid;
      margin: 16px 0;
    }
    .callout.info { background: var(--info-bg); border-color: var(--info-border); }
    .callout.neutral { background: var(--neutral-bg); border-color: var(--border); }
    .callout.warn { background: var(--warn-bg); border-color: var(--warn-border); }
    .callout .title {
      font-weight: 650;
      margin-bottom: 4px;
    }
    .callout .body { font-size: 0.9rem; color: var(--muted); }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin: 16px 0;
    }
    .fields {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
    }
    label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      min-width: 160px;
    }
    select {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      min-width: 180px;
      max-width: 240px;
      background: var(--input-bg);
      color: var(--text);
      appearance: auto;
    }
    select:focus {
      outline: 2px solid color-mix(in srgb, var(--accent) 40%, transparent);
      border-color: var(--accent);
    }
    select option {
      background: var(--surface);
      color: var(--text);
    }
    .actions { display: flex; gap: 8px; }
    button {
      font: inherit;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
      border: 1px solid transparent;
    }
    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-primary {
      background: var(--accent);
      color: #12161b;
    }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-ghost {
      background: transparent;
      border-color: var(--border);
      color: var(--text);
    }
    .btn-ghost:hover:not(:disabled) { background: var(--neutral-bg); }
    .cat-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      margin-bottom: 12px;
    }
    .cat-row .cat-label {
      font-size: 0.8rem;
      font-weight: 600;
    }
    .cat-toggles {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .cat-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 7px 14px;
      border-radius: 8px;
      font-weight: 600;
    }
    .cat-btn:hover {
      border-color: color-mix(in srgb, var(--accent) 50%, var(--border));
      color: var(--text);
      background: var(--neutral-bg);
    }
    .cat-btn.is-on {
      background: var(--accent);
      border-color: var(--accent);
      color: #12161b;
    }
    .cat-btn.is-on:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
      color: #12161b;
    }
    .err {
      color: var(--err);
      font-size: 0.85rem;
      margin-top: 8px;
    }
    .result-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .result-head .count {
      margin-left: auto;
      color: var(--muted);
      font-size: 0.85rem;
    }
    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th, td {
      padding: 8px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      white-space: nowrap;
    }
    th {
      background: var(--th-bg);
      position: sticky;
      top: 0;
      font-weight: 650;
      font-size: 0.8rem;
      color: var(--muted);
    }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    td.num.match {
      background: color-mix(in srgb, var(--accent) 28%, transparent);
      color: #f0f6ff;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
      border-radius: 4px;
    }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:last-child td { border-bottom: none; }
    hr.sep {
      border: none;
      border-top: 1px solid var(--border);
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>シレン6 価格検索</h1>
    <p class="lead">風来のシレン6・とぐろ島探検録。店で見た価格から候補アイテムを逆引きします（腕輪・草・巻物・壺・杖）。</p>

    <div class="stats" id="stats"></div>

    <div class="callout info">
      <div class="title">照合ルール</div>
      <div class="body">種別は All / 腕輪 / 草 / 巻物 / 壺 / 杖（初期は All）。価格は買値・売値のどちらかに一致すればヒット（祝福×2、呪い×0.87切り捨て、壺・杖は容量/回数ステップ込み）。種別と価格を両方選ぶと AND。</div>
    </div>

    <div class="panel">
      <h2 style="margin-bottom:12px">条件を選択</h2>
      <div class="cat-row">
        <span class="cat-label">種別</span>
        <div class="cat-toggles" id="categoryToggles" role="group" aria-label="種別">
          <button type="button" class="cat-btn is-on" data-category="" aria-pressed="true">All</button>
          <button type="button" class="cat-btn" data-category="腕輪" aria-pressed="false">腕輪</button>
          <button type="button" class="cat-btn" data-category="草" aria-pressed="false">草</button>
          <button type="button" class="cat-btn" data-category="巻物" aria-pressed="false">巻物</button>
          <button type="button" class="cat-btn" data-category="壺" aria-pressed="false">壺</button>
          <button type="button" class="cat-btn" data-category="杖" aria-pressed="false">杖</button>
        </div>
      </div>
      <div class="fields">
        <label>価格
          <select id="price"></select>
        </label>
        <div class="actions">
          <button type="button" class="btn-ghost" id="clearBtn">クリア</button>
        </div>
      </div>
    </div>

    <hr class="sep" />

    <div id="results"></div>

  </div>

    { name: "鈍足の杖", category: "杖", buy: 700, sell: 280, range: [4, 6] },
    { name: "一時しのぎの杖", category: "杖", buy: 1000, sell: 400, range: [4, 6] },
    { name: "幸せの杖", category: "杖", buy: 1000, sell: 400, range: [4, 6] },
    { name: "不幸の杖", category: "杖", buy: 1000, sell: 400, range: [4, 6] },
    { name: "痛み分けの杖", category: "杖", buy: 1000, sell: 400, range: [5, 7] },
    { name: "ガイコツまどうの杖", category: "杖", buy: 1000, sell: 400, range: [5, 7] },
    { name: "身代わりの杖", category: "杖", buy: 2000, sell: 800, range: [4, 6] },
    { name: "桃まんの杖", category: "杖", buy: 2000, sell: 800, range: [4, 6] }
  ];

  function applyModifier(price, mod) {
    if (mod === "祝福") return price * BLESS;
    if (mod === "呪い") return Math.floor(price * CURSE);
    return price;
  }

  function collectPrices() {
    var set = {};
    var mods = ["通常", "祝福", "呪い"];
    for (var i = 0; i < ITEMS.length; i++) {
      var item = ITEMS[i];
      var isStepped = item.category === "壺" || item.category === "杖";
      var extras = isStepped
        ? Array.from({ length: MAX_EXTRA + 1 }, function (_, n) { return n; })
        : [0];
      for (var e = 0; e < extras.length; e++) {
        var extra = extras[e];
        var baseBuy = item.buy + extra * STEP_BUY;
        var baseSell = item.sell + extra * STEP_SELL;
        for (var m = 0; m < mods.length; m++) {
          set[applyModifier(baseBuy, mods[m])] = true;
          set[applyModifier(baseSell, mods[m])] = true;
        }
      }
    }
    return Object.keys(set)
      .map(Number)
      .sort(function (a, b) { return a - b; });
  }

  function sortHits(hits) {
    hits.sort(function (a, b) {
      if (a.item.category !== b.item.category) {
        return a.item.category.localeCompare(b.item.category, "ja");
      }
      if (a.item.buy !== b.item.buy) return a.item.buy - b.item.buy;
      if (a.extra !== b.extra) return a.extra - b.extra;
      return a.item.name.localeCompare(b.item.name, "ja");
    });
    return hits;
  }

  function listCategoryItems(categoryQ) {
    var hits = [];
    for (var i = 0; i < ITEMS.length; i++) {
      var item = ITEMS[i];
      if (categoryQ && item.category !== categoryQ) continue;
      hits.push({
        item: item,
        modifier: "通常",
        extra: 0,
        matchBuy: item.buy,
        matchSell: item.sell
      });
    }
    return sortHits(hits);
  }

  function findHits(priceQ, categoryQ) {
    if (priceQ === null) return [];
    var hits = [];
    var mods = ["通常", "祝福", "呪い"];
    for (var i = 0; i < ITEMS.length; i++) {
      var item = ITEMS[i];
      if (categoryQ && item.category !== categoryQ) continue;
      var isStepped = item.category === "壺" || item.category === "杖";
      var extras = isStepped
        ? Array.from({ length: MAX_EXTRA + 1 }, function (_, n) { return n; })
        : [0];
      for (var e = 0; e < extras.length; e++) {
        var extra = extras[e];
        var baseBuy = item.buy + extra * STEP_BUY;
        var baseSell = item.sell + extra * STEP_SELL;
        for (var m = 0; m < mods.length; m++) {
          var modifier = mods[m];
          var matchBuy = applyModifier(baseBuy, modifier);
          var matchSell = applyModifier(baseSell, modifier);
          if (matchBuy === priceQ || matchSell === priceQ) {
            hits.push({ item: item, modifier: modifier, extra: extra, matchBuy: matchBuy, matchSell: matchSell });
          }
        }
      }
    }
    return sortHits(hits);
  }

  function noteFor(hit) {
    var parts = [];
    if (hit.modifier !== "通常") parts.push(hit.modifier);
    if (hit.item.category === "壺" && hit.extra > 0) parts.push("容量" + hit.extra);
    if (hit.item.category === "杖" && hit.extra > 0) parts.push("回数" + hit.extra);
    if (hit.item.category === "壺" && hit.extra === 0) parts.push("容量0基準");
    if (hit.item.category === "杖" && hit.extra === 0) parts.push("回数0基準");
    if (hit.item.range) {
      var label = hit.item.category === "壺" ? "出現容量" : "出現回数";
      parts.push(label + hit.item.range[0] + "–" + hit.item.range[1]);
    }
    if (hit.item.identified) parts.push("入手時識別");
    if (hit.item.notInShinzui) parts.push("神髄に出ない");
    if (hit.item.tag) parts.push(hit.item.tag);
    return parts.join(" · ") || "—";
  }

  function categoryCounts() {
    var counts = { "腕輪": 0, "草": 0, "巻物": 0, "壺": 0, "杖": 0 };
    for (var i = 0; i < ITEMS.length; i++) counts[ITEMS[i].category] += 1;
    return counts;
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  var categoryTogglesEl = document.getElementById("categoryToggles");
  var priceEl = document.getElementById("price");
  var clearBtn = document.getElementById("clearBtn");
  var resultsEl = document.getElementById("results");
  var statsEl = document.getElementById("stats");
  var PRICES = collectPrices();
  var selectedCategory = null;

  function fillPriceSelect() {
    var html = '<option value="">価格を選択</option>';
    for (var i = 0; i < PRICES.length; i++) {
      html += '<option value="' + PRICES[i] + '">' + PRICES[i] + "</option>";
    }
    priceEl.innerHTML = html;
  }

  function syncCategoryButtons() {
    var buttons = categoryTogglesEl.querySelectorAll(".cat-btn");
    var current = selectedCategory === null ? "" : selectedCategory;
    for (var i = 0; i < buttons.length; i++) {
      var btn = buttons[i];
      var on = btn.getAttribute("data-category") === current;
      btn.classList.toggle("is-on", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
    }
  }

  function renderStats() {
    var c = categoryCounts();
    var total = ITEMS.length;
    var items = [
      [String(total), "収録アイテム"],
      [String(c["腕輪"]), "腕輪"],
      [String(c["草"]), "草"],
      [String(c["巻物"]), "巻物"],
      [String(c["壺"]), "壺"],
      [String(c["杖"]), "杖"]
    ];
    statsEl.innerHTML = items.map(function (pair) {
      return '<div class="stat"><div class="v">' + pair[0] + '</div><div class="l">' + pair[1] + "</div></div>";
    }).join("");
  }

  function renderResults(hits, priceQ) {
    var head =
      '<div class="result-head"><h2>検索結果</h2><span class="count">' +
      hits.length +
      " 件</span></div>";
    if (hits.length === 0) {
      resultsEl.innerHTML =
        head +
        '<div class="callout warn"><div class="title">該当なし</div>' +
        '<div class="body">選んだ条件に一致するアイテムはありませんでした。祝福・呪い、壺の容量、杖の回数も照合しています。</div></div>';
      return;
    }
    var rows = hits.map(function (hit) {
      var buyCls = "num" + (priceQ !== null && hit.matchBuy === priceQ ? " match" : "");
      var sellCls = "num" + (priceQ !== null && hit.matchSell === priceQ ? " match" : "");
      return (
        "<tr>" +
        "<td>" + escapeHtml(hit.item.name) + "</td>" +
        "<td>" + escapeHtml(hit.item.category) + "</td>" +
        '<td class="num">' + hit.item.buy + "</td>" +
        '<td class="num">' + hit.item.sell + "</td>" +
        '<td class="' + buyCls + '">' + hit.matchBuy + "</td>" +
        '<td class="' + sellCls + '">' + hit.matchSell + "</td>" +
        "<td>" + escapeHtml(noteFor(hit)) + "</td>" +
        "</tr>"
      );
    }).join("");
    resultsEl.innerHTML =
      head +
      '<div class="table-wrap"><table><thead><tr>' +
      "<th>名前</th><th>種別</th>" +
      '<th class="num">基準買値</th><th class="num">基準売値</th>' +
      '<th class="num">一致買値</th><th class="num">一致売値</th>' +
      "<th>メモ</th>" +
      "</tr></thead><tbody>" +
      rows +
      "</tbody></table></div>";
  }

  function refresh() {
    var priceRaw = priceEl.value;
    var priceQ = priceRaw === "" ? null : Number(priceRaw);
    var categoryQ = selectedCategory;

    // All (null) or a category, with no price → base-price listing
    if (priceQ === null) {
      renderResults(listCategoryItems(categoryQ), null);
      return;
    }
    // price set → match across All or AND with category
    renderResults(findHits(priceQ, categoryQ), priceQ);
  }

  function onCategoryClick(ev) {
    var btn = ev.target.closest(".cat-btn");
    if (!btn || !categoryTogglesEl.contains(btn)) return;
    var cat = btn.getAttribute("data-category");
    // All → null; picking a category selects it (radio; re-tap keeps it)
    selectedCategory = cat === "" ? null : cat;
    syncCategoryButtons();
    refresh();
  }

  function onClear() {
    selectedCategory = null;
    syncCategoryButtons();
    priceEl.value = "";
    refresh();
    priceEl.focus();
  }

  clearBtn.addEventListener("click", onClear);
  categoryTogglesEl.addEventListener("click", onCategoryClick);
  priceEl.addEventListener("change", refresh);

  fillPriceSelect();
  syncCategoryButtons();
  renderStats();
  refresh();
})();
  </script>
</body>
</html>
